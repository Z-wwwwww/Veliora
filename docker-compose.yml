services:
  veliora:
    build: .   # 使用本仓库 Dockerfile 构建（上游镜像 bestzwei/libretv 不含电视版 UI）
    container_name: veliora
    ports:
      - "8899:8080" # 将内部 8080 端口映射到主机的 8899 端口
    environment:
      - PASSWORD=${PASSWORD:-your_password} # 可将 your_password 修改为你想要的密码，默认为 your_password
#    volumes:
#      - veliora_data:/app # 不要修改
    restart: unless-stopped

